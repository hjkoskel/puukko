# PUUKKO C64 memory map  (BASIC + KERNAL banked out, $01 = $35)
#   $0200-$03FF  digi nibble tables          $0400-$07E7  colour RAM backing copy
#   $0801-$BFFF  program, data, BSS, C stack (file is padded up to $BFFF)
#   $C000-$CFFF  in the file: HIDATA blob, relocated to $F600 at startup;
#                at runtime: screen $C000, sprites $C400-$C6FF, charset $C800
#   $D000-$DF80  sprite cache, fighter 1 (RAM under I/O, $01 = $34 to access)
#   $E000-$EF80  sprite cache, fighter 0     $F000-$F1FF  sprite mirror tables
#   $F200-$F5E7  screen backing copy         $F600-$FFF9  HIDATA (digis)
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0300;
    __HIMEM__:     type = weak, value = $C000;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __HIMEM__ - __HEADER_LAST__, fill = yes;
    BSS:      file = "",               start = __ONCE_RUN__,    size = __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__;
    LOADHI:   file = %O,               start = $C000,           size = $1000;
    HIRAM:    file = "",               start = $F600,           size = $09FA;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
    HIDATA:   load = LOADHI,   run = HIRAM, type = ro, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
