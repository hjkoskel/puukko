# loading-screen program: BASIC stub at $0801, resident loader in the cassette buffer
MEMORY {
    LOADADDR: file = %O, start = $07FF, size = 2;
    MAIN:     file = %O, start = $0801, size = $3000;
    CASBUF:   file = "", start = $0334, size = $00CB;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    MAIN:     load = MAIN,     type = rw;
    RES:      load = MAIN, run = CASBUF, type = rw, define = yes;
}
